name: Tests

# The same tests the pre-push hook runs (docs/testing.md), as a safety net for pushes that skipped the hook.
# Runs on GitHub's minutes, not Netlify's. Pushes made by other workflows (the daily feed update) don't start it;
# that workflow runs the fast tests itself before committing.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the proof tests read the code from before earlier fixes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/test.mjs
      - name: Types (JSDoc, no build)
        run: scripts/typecheck.sh
