[build]
  publish = "public"
  # Skip the build (exit 0) when a push only touches files the site doesn't use, e.g. artwork/kick/ or the README.
  # $CACHED_COMMIT_REF is the last deployed commit; if it's missing (first build), git errors and the build runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  # OBS browser sources load Botrix widgets from botrix.live; the injected CSS (public/obs/botrix/) pulls
  # these fonts cross-origin, which browsers only allow with this header.
  for = "/assets/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
