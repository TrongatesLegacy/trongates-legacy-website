<!doctype html>
<!-- A still mockup of Chaplinko (docs/plans/chaplinko/plan.md), drawn with the real widget themes. Not the game:
     nothing moves. ?v=classic|pachinko|tower|jackpot|clear|panel|strip|lbclear|scene|combined|hero|accents|sb-drop|sb-jackpot|sb-leaderboard|sb-board shows one frame at its real size (for screenshots);
     no ?v shows them all. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chaplinko mockup</title>
<link rel="stylesheet" href="../../../public/widgets/lib/themes.css">
<!-- the planned chaplinko theme (plan.md, "Brand"); Google Fonts only in this mockup, the build self-hosts them -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;600;700&display=block">
<style>
  body { margin: 0; background: #0b0b0f; color: #ddd; font: 14px system-ui; }
  .page { display: flex; flex-wrap: wrap; gap: 28px; padding: 28px; align-items: flex-start; }
  .solo .page { padding: 0; gap: 0; }
  .cap { font: 600 13px system-ui; color: #aaa; margin: 0 0 8px; }
  .solo .cap { display: none; }
  .w { position: relative; overflow: hidden; background: var(--bg); box-shadow: var(--edge); border-radius: var(--radius);
       font-family: var(--font); color: var(--text); }
  .w svg { position: absolute; inset: 0; }
  /* leaderboard side panel (full layout) */
  .lb { position: absolute; top: 18px; right: 18px; bottom: 18px; width: 272px; background: var(--panel);
        border-radius: calc(var(--radius) * .8); padding: 16px 16px 12px; display: flex; flex-direction: column; }
  .lb h2 { margin: 0 0 10px; font: var(--display-weight) 22px var(--display); letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs span { flex: 1; text-align: center; padding: 5px 0; border-radius: 999px; background: var(--slot); color: var(--muted); font-size: 12px; font-weight: 600; }
  .tabs span.on { background: var(--accent); color: var(--accent-ink); }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 15px; border-bottom: 1px solid color-mix(in srgb, var(--text) 8%, transparent); }
  .row b { width: 20px; color: var(--muted); font-weight: 600; }
  .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .p { font-weight: 700; font-variant-numeric: tabular-nums; }
  .row:first-of-type .p { color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tw { background: #9146ff; } .kk { background: #53fc18; }
  .best { margin-top: auto; background: var(--slot); border-radius: calc(var(--radius) * .6); padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .best strong { color: var(--gold); font-size: 14px; }
  .how { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
  .how code { font-family: inherit; color: var(--text); font-weight: 700; background: var(--slot); padding: 1px 6px; border-radius: 6px; }
  .credit { position: absolute; left: 18px; bottom: 8px; font-size: 10px; color: var(--muted); opacity: .7; }
  /* jackpot card */
  .dim { position: absolute; inset: 0; background: rgb(0 0 0 / .45); }
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg); text-align: center;
          background: var(--panel); border-radius: var(--radius); padding: 18px 34px 20px; box-shadow: var(--edge), 0 20px 60px rgb(0 0 0 / .5);
          outline: 3px solid var(--gold); outline-offset: -3px; }
  .card .k { font: var(--display-weight) 44px var(--display); color: var(--gold); letter-spacing: .03em; line-height: 1; }
  .card .who { margin-top: 10px; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .card .pts { font: var(--display-weight) 30px var(--display); margin-top: 4px; }
  .card .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  /* !drop top popup */
  .pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 600px; background: var(--panel);
         border-radius: var(--radius); box-shadow: var(--edge), 0 20px 60px rgb(0 0 0 / .45); padding: 18px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pop h3 { margin: 0 0 8px; font: var(--display-weight) 20px var(--display); }
  /* tower header */
  .th { position: absolute; left: 12px; right: 12px; top: 12px; background: var(--panel); border-radius: calc(var(--radius) * .8); padding: 8px 12px; }
  .th .row { font-size: 13px; padding: 3px 2px; }
  .th .t { font: var(--display-weight) 13px var(--display); color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }
  .lb.src { left: 14px; right: 14px; top: 14px; bottom: 14px; width: auto; background: transparent; padding: 6px 8px 4px; }
  .strip { position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .strip .st { font: var(--display-weight) 16px var(--display); color: var(--muted); margin-right: 4px; }
  .strip .chip { display: flex; align-items: center; gap: 7px; background: var(--panel); border-radius: 999px; padding: 7px 14px 7px 8px; font-size: 15px; }
  .strip .chip i { font-style: normal; }
  .strip .chip b { margin-left: 6px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .strip .how { margin: 0 0 0 auto; }
  .scene { position: relative; width: 1280px; height: 720px; overflow: hidden;
           background: radial-gradient(circle at 60% 40%, #3b6b4a, #1d3326 60%, #0e1a13); }
  .scene::before { content: "your game"; position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font: 800 64px system-ui; color: #fff2; letter-spacing: .1em; }
  .src-at { position: absolute; outline: 2px dashed #ff4a4a; outline-offset: 3px; }
  .tag { position: absolute; left: 0; top: -26px; background: #ff4a4a; color: #fff; font: 600 12px system-ui; padding: 3px 7px; border-radius: 4px; }
  .w.clear { --bgo: 0; box-shadow: none; }
  .w.clear svg circle, .w.clear svg rect, .w.clear svg text { filter: drop-shadow(0 1px 2px rgb(0 0 0 / .8)); }
  .scene > .w.clear { position: absolute; inset: 0; }
  .w.clear svg text[style*="accent-ink"] { filter: none; }
  .w.clear .lb, .w.clear .tabs span:not(.on), .w.clear .best, .w.clear .strip .chip, .w.clear .how code { background: none; }
  .w.clear .tabs span:not(.on) { box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .35); }
  .w.clear .tabs .on { text-shadow: none; }
  .w.clear .best { padding-left: 4px; }
  .w.clear .row { border-color: rgb(255 255 255 / .12); }
  .w.clear, .w.clear .lb h2, .w.clear .strip .st { text-shadow: 0 1px 2px rgb(0 0 0 / .9), 0 0 6px rgb(0 0 0 / .5); }
  .w.clear .muted, .w.clear .strip .st, .w.clear .row b { color: var(--text); }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  [data-theme=chaplinko] {
    --bg: rgb(10 18 51 / var(--bgo, 1)); --panel: #121d4d; --slot: #1b2a66; --text: #eef3ff; --muted: #9fb0e0; --accent: #ff7a1a; --accent-ink: #1a0a00;
    --gold: #ff3d8b; --edge: inset 0 0 0 1px #2f5bff55, 0 0 40px #2f5bff22; --radius: 18px;
    --font: "Space Grotesk", system-ui, sans-serif; --display: Bungee, system-ui, sans-serif; --display-weight: 400; }
  .bare, .bare body { background: transparent; }
  /* motion storyboards */
  .sb { display: flex; gap: 16px; align-items: flex-start; }
  .sb figure { margin: 0; }
  .sb figcaption { font: 13px/1.45 system-ui; color: #b8b8c4; margin-top: 10px; }
  .sb figcaption b { display: block; color: #fff; font-size: 14px; margin-bottom: 2px; }
  .sbw { position: relative; overflow: hidden; border-radius: 14px; }
  .sbw > .scaled { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .row.fx { position: relative; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-left: 6px; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// slot colour: low values the plain slot colour, rising to the accent, the top prize gold
function slotFill(v, max) {
  if (v === max) return 'var(--gold)';
  const t = Math.round(Math.pow(v / max, .45) * 85);
  return `color-mix(in oklch, var(--accent) ${t}%, var(--slot))`;
}
function slotInk(v, max) { return v === max || v / max > .3 ? 'var(--accent-ink)' : 'var(--text)'; }

// the drop chute at the top of every board, carrying the commands (plan.md, "Chat commands")
const CMDS = `!drop <tspan style="fill:var(--muted)">·</tspan> !drop 5 <tspan style="fill:var(--muted)">·</tspan> !drop 5 <tspan style="fill:var(--accent)">:emote:</tspan>`;
const chute = (cx, label = CMDS, extra = '') => `<rect x="${cx - 132}" y="0" width="264" height="30" rx="8" style="fill:var(--slot)"/>${extra}` +
  `<text x="${cx}" y="15" font-size="12.5" text-anchor="middle" dominant-baseline="central" style="font-family:var(--font);font-weight:700;fill:var(--text)">${label}</text>`;
function svg(w, h, parts) { return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="${NS}">
  <defs>
    <radialGradient id="shine" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>${parts.join('')}</svg>`; }

const peg = (x, y, r = 4.5) => `<circle cx="${x}" cy="${y}" r="${r}" style="fill:color-mix(in srgb, var(--text) 85%, var(--accent))"/><circle cx="${x - 1.2}" cy="${y - 1.2}" r="${r * .45}" fill="#fff" opacity=".35"/>`;
// balls take the chatter's chat colour (the default); a chatter with none gets the accent
const ball = (x, y, r = 10, trail = 0, c = 'var(--accent)') =>
  (trail ? `<line x1="${x}" y1="${y - trail}" x2="${x}" y2="${y}" stroke-width="${r * 1.4}" stroke-linecap="round" style="stroke:${c}" opacity=".18"/>` : '') +
  `<circle cx="${x}" cy="${y}" r="${r}" style="fill:${c}"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#shine)"/>`;
const CHAT = ['#ff4f9a', '#1e90ff', '#ffb000', '#2ee6a8', 'var(--accent)', '#b36bff'];
// an emote ball: in the game the emote's own image (Twitch/Kick CDN), spinning as it rolls; here an emoji stands in
const emote = (x, y, e, r = 13, rot = 0) => `<text x="${x}" y="${y}" font-size="${r * 2}" text-anchor="middle" dominant-baseline="central" transform="rotate(${rot} ${x} ${y})">${e}</text>`;
const text = (x, y, s, size, style = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle" dominant-baseline="central" style="font-family:var(--display);font-weight:var(--display-weight);${style}">${s}</text>`;

function slots(x0, y, w, h, vals, gap = 3) {
  const max = Math.max(...vals), sw = w / vals.length; let s = '';
  vals.forEach((v, i) => {
    const x = x0 + i * sw;
    s += `<rect x="${x + gap / 2}" y="${y}" width="${sw - gap}" height="${h}" rx="6" style="fill:${slotFill(v, max)}"/>`;
    if (v === max) s += `<rect x="${x + gap / 2}" y="${y}" width="${sw - gap}" height="${h}" rx="6" style="fill:var(--gold)" filter="url(#glow)" opacity=".6"/>`;
    s += text(x + sw / 2, y + h / 2 + 1, v, sw < 34 ? 12 : 15, `fill:${slotInk(v, max)}`);
  });
  return s;
}

// Classic: a triangle of pegs, rows+2 pegs across the bottom, one slot under each gap
function classic(o = {}) {
  const W = o.w || 640, cx = W / 2, rows = 10, gap = 46, dy = 38, top = 66, vals = [100, 25, 10, 5, 2, 1, 2, 5, 10, 25, 100];
  const p = [];
  // drop chute
  p.push(chute(cx));
  for (let r = 0; r < rows; r++) { const n = r + 3; for (let i = 0; i < n; i++) p.push(peg(cx + (i - (n - 1) / 2) * gap, top + r * dy)); }
  const bw = (rows + 1) * gap, sy = top + (rows - 1) * dy + 22;
  p.push(slots(cx - bw / 2, sy, bw, 44, vals));
  if (o.balls !== false) {
    p.push(ball(cx - 8, 44, 10, 18, CHAT[0]), ball(cx + 30, 128, 10, 22, CHAT[1]), ball(cx - 50, 196, 10, 24, CHAT[2]), emote(cx + 70, 236, '🔥', 12, 20), emote(cx + 92, 250, '🔥', 12, -30),
      ball(cx - 118, 300, 10, 26, CHAT[3]), emote(cx + 18, 320, '😂', 12, 40), ball(cx + 150, 352, 10, 20, CHAT[4]), ball(cx - 26, sy + 10, 10, 0, CHAT[5]));
    // a score floating up from a slot
    p.push(text(cx - 26, sy - 14, '+1', 14, 'fill:var(--text);opacity:.8'), text(cx + 184, sy - 22, '+10', 16, 'fill:var(--accent)'));
  }
  return svg(W, 540, p);
}

// Pachinko: pins in clusters, two spinners and bumpers over a centre jackpot; scores still at the bottom
function pachinko() {
  const W = 640, p = [], vals = [2, 5, 10, 25, 250, 25, 10, 5, 2];
  p.push(`<rect x="20" y="16" width="600" height="440" rx="200" ry="40" fill="none" stroke-width="2" style="stroke:color-mix(in srgb, var(--accent) 45%, transparent)"/>`);
  for (let r = 0; r < 12; r++) for (let i = 0; i < 16; i++) {
    const x = 50 + i * 36 + (r % 2) * 18, y = 58 + r * 30;
    const d1 = Math.hypot(x - 190, y - 170), d2 = Math.hypot(x - 450, y - 170), d3 = Math.hypot(x - 320, y - 300);
    if (d1 < 44 || d2 < 44 || d3 < 50 || x > 600) continue;
    if (rnd() < .18) continue;
    p.push(peg(x, y, 3.5));
  }
  const spinner = (x, y, a) => { let s = `<g transform="rotate(${a} ${x} ${y})">`; for (let k = 0; k < 4; k++) s += `<rect x="${x - 3}" y="${y - 32}" width="6" height="32" rx="3" transform="rotate(${k * 90} ${x} ${y})" style="fill:var(--accent)"/>`; return s + `<circle cx="${x}" cy="${y}" r="7" style="fill:var(--tile)"/></g>`; };
  p.push(spinner(190, 170, 20), spinner(450, 170, 55));
  const bumper = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r + 5}" style="fill:var(--accent)" opacity=".25" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="${r}" style="fill:var(--panel);stroke:var(--accent)" stroke-width="3"/>`;
  p.push(bumper(270, 300, 16), bumper(370, 300, 16), bumper(320, 262, 12));
  p.push(text(320, 340, '★ JACKPOT ★', 11, 'fill:var(--gold);letter-spacing:.15em'));
  p.push(slots(40, 470, 560, 46, vals, 5), chute(320));
  p.push(ball(120, 90, 8, 20), ball(212, 140, 8), ball(468, 228, 8, 16), ball(330, 236, 8), emote(400, 110, '🐸', 11, 15), emote(540, 380, '🐸', 11, -20), ball(300, 420, 8, 22), ball(88, 440, 8, 14));
  return svg(W, 540, p);
}

// Pin tower: tall and narrow (the side of the screen), a staggered wall of pins
function tower() {
  const W = 360, H = 640, p = [], vals = [50, 10, 3, 1, 3, 10, 50];
  for (let r = 0; r < 17; r++) { const n = r % 2 ? 7 : 8; for (let i = 0; i < n; i++) p.push(peg(34 + i * 41 + (r % 2) * 20.5, 62 + r * 30, 4)); }
  p.push(chute(180));
  p.push(slots(12, 574, 336, 50, vals, 4));
  p.push(ball(180, 48, 10, 16), ball(98, 212, 10, 22), emote(250, 300, '💜', 12, 10), ball(170, 380, 10, 20), ball(300, 470, 10, 18), emote(116, 520, '💜', 12, -15));
  p.push(text(300, 556, '+10', 15, 'fill:var(--accent)'));
  return svg(W, H, p);
}

const PLAYERS = [['lulu_gang_4life', 'kk', 1284], ['pixelpriya', 'tw', 1122], ['m0ssy', 'kk', 865], ['DrBlobfish', 'tw', 640], ['neon_nana', 'kk', 512], ['kevxd', 'tw', 377], ['sprout', 'kk', 240]];
const rows = (n, list = PLAYERS) => list.slice(0, n).map(([u, pl, s], i) => `<div class="row"><b>${i + 1}</b><span class="dot ${pl}"></span><span class="n">${u}</span><span class="p">${s.toLocaleString()}</span></div>`).join('');
const ALLTIME = [...PLAYERS].reverse().map(([u, p, s], i) => [u, p, s * (9 - i)]).sort((a, b) => b[2] - a[2]);
// the leaderboard source: its own OBS browser source, reading the board's scores (plan.md, "The leaderboard source")
const panel = () => `<div class="lb src"><h2>Leaderboard</h2><div class="tabs"><span class="on">This stream</span><span>All time</span></div>${rows(5)}</div>`;
const strip = () => `<div class="strip"><span class="st">This stream</span>${PLAYERS.slice(0, 3).map(([u, pl, s], i) =>
  `<span class="chip"><i>${['🥇', '🥈', '🥉'][i]}</i><span class="dot ${pl}"></span>${u}<b>${s.toLocaleString()}</b></span>`).join('')}</div>`;
const credit = '<div class="credit">Made by TrongatesLegacy.com</div>';

const frame = (theme, w, h, inner, accent, clear) => `<div class="w${clear ? ' clear' : ''}" data-theme="${theme}" style="width:${w}px;height:${h}px;${accent ? `--accent:${accent}` : ''}">${inner}</div>`;

const confetti = () => { let s = ''; for (let i = 0; i < 70; i++) { const c = ['var(--gold)', 'var(--accent)', 'var(--text)', '#ff5a5f', '#2ee6a8'][i % 5]; s += `<rect x="${rnd() * 960}" y="${rnd() * 540}" width="${6 + rnd() * 6}" height="${3 + rnd() * 4}" transform="rotate(${rnd() * 360})" style="fill:${c}" opacity=".9"/>`; } return svg(960, 540, [s]); };

// ---- motion storyboards (plan.md, "Animations") ----
const fig = (w, h, inner, t, cap) => `<figure style="width:${w}px"><div class="sbw" style="width:${w}px;height:${h}px">${inner}</div><figcaption><b>${t}</b>${cap}</figcaption></figure>`;
const scaled = (k, html) => `<div class="scaled" style="transform:scale(${k})">${html}</div>`;
const pegc = (x, y, c, a = 1, r = 4.5) => `<circle cx="${x}" cy="${y}" r="${r + 3}" style="fill:${c}" opacity="${a * .45}" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="${r}" style="fill:${c}" opacity="${a}"/>`;
const ring = (x, y, r, c, a = .6, w = 2) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke-width="${w}" style="stroke:${c}" opacity="${a}"/>`;
const spark = (x, y, s, c) => `<path d="M${x} ${y - s}L${x + s * .28} ${y - s * .28}L${x + s} ${y}L${x + s * .28} ${y + s * .28}L${x} ${y + s}L${x - s * .28} ${y + s * .28}L${x - s} ${y}L${x - s * .28} ${y - s * .28}Z" style="fill:${c}"/>`;
// a small board (4 rows, 5 slots) for the close-up frames
function mini(o = {}) {
  const W = 300, H = 250, cx = 150, gap = 44, dy = 34, top = 60, P = [], p = [];
  for (let r = 0; r < 4; r++) { const n = r + 3; for (let i = 0; i < n; i++) P.push({ r, i, x: cx + (i - (n - 1) / 2) * gap, y: top + r * dy }); }
  const bw = 5 * gap, sy = top + 3 * dy + 22, sw = gap, vals = [25, 5, 1, 5, 25];
  p.push(o.chute || chute(cx));
  P.forEach((q) => { const f = o.peg && o.peg(q); p.push(f !== undefined ? f : peg(q.x, q.y)); });
  vals.forEach((v, i) => {
    const x = cx - bw / 2 + i * sw, fx = (o.slot && o.slot(i)) || {}, k = fx.scale || 1, ox = x + sw / 2, oy = sy + 20;
    p.push(`<g transform="translate(0 ${fx.dy || 0}) translate(${ox} ${oy}) scale(${k}) translate(${-ox} ${-oy})" opacity="${fx.a ?? 1}">` +
      `<rect x="${x + 1.5}" y="${sy}" width="${sw - 3}" height="40" rx="6" style="fill:${slotFill(v, 25)}"/>` +
      (fx.flash ? `<rect x="${x + 1.5}" y="${sy}" width="${sw - 3}" height="40" rx="6" style="fill:${fx.flash}" opacity=".55"/>` : '') +
      text(x + sw / 2, sy + 21, v, 14, `fill:${slotInk(v, 25)}`) + '</g>');
  });
  if (o.extra) p.push(o.extra({ cx, P, sy, sw, bw, x0: cx - bw / 2 }));
  return frame('chaplinko', W, H, svg(W, H, p));
}
const at = (P, r, i) => P.find((q) => q.r === r && q.i === i);
const sbDrop = () => `<div class="sb">
  ${fig(300, 250, mini({ chute: chute(150, `<tspan style="fill:var(--accent)">×4</tspan> more coming`, ''), extra: () => `<g transform="translate(150 30) scale(1 .86) translate(-150 -30)"></g>` + ball(150, 42, 11.5, 0, CHAT[0]) + `<path d="M141 33 q9 -6 18 0" fill="none" stroke-width="2" style="stroke:var(--text)" opacity=".5"/>` }),
    '0 ms · the drop', 'The chute gulps (squash and spring, 220 ms) and pops the ball out a little big (scale 1.15 → 1). <code>!drop 5</code> streams the rest 120 ms apart and the chute counts them down.')}
  ${fig(300, 250, mini({ peg: (q) => q.r === 1 && q.i === 1 ? pegc(q.x, q.y, CHAT[0]) + ring(q.x, q.y, 13, CHAT[0]) + ring(q.x, q.y, 20, CHAT[0], .25, 1.5) : undefined,
    extra: ({ P }) => { const q = at(P, 1, 1); return [5, 4, 3, 2, 1].map((k) => `<circle cx="${q.x - 6 - k * 4}" cy="${q.y - 14 - k * 7}" r="${9 - k}" style="fill:${CHAT[0]}" opacity="${.07 * (6 - k)}"/>`).join('') +
      `<ellipse cx="${q.x - 6}" cy="${q.y - 13}" rx="11" ry="8.6" transform="rotate(-30 ${q.x - 6} ${q.y - 13})" style="fill:${CHAT[0]}"/><ellipse cx="${q.x - 6}" cy="${q.y - 13}" rx="11" ry="8.6" fill="url(#shine)"/>`; } }),
    'every peg hit', 'The peg flashes the ball’s colour and a ring spreads out (250 ms). The ball squashes a touch against it. A short trail follows each ball and fades.')}
  ${fig(300, 250, mini({ peg: (q) => { const a = { '0,0': .9, '1,1': .75, '2,1': .55, '3,2': .35 }[q.r + ',' + q.i], b = { '0,0': .35, '1,0': .5, '2,0': .3, '3,0': .7 }[q.r + ',' + q.i];
      return a ? pegc(q.x, q.y, CHAT[0], a) : b ? pegc(q.x, q.y, CHAT[1], b) : undefined; },
    extra: ({ P }) => { const q = at(P, 3, 2), b = at(P, 3, 0); return ball(q.x + 14, q.y + 12, 10, 0, CHAT[0]) + ball(b.x - 14, b.y - 16, 10, 0, CHAT[1]); } }),
    'hot pegs', 'Pegs keep a glow in the colour of the ball that hit them, fading over 2 s, so the board shows the paths the balls took. A busy board lights up.')}
  ${fig(300, 250, mini({ slot: (i) => i === 3 ? { dy: 3, scale: 1.1, flash: CHAT[0] } : null,
    extra: ({ x0, sw, sy }) => { const x = x0 + 3.5 * sw; return ball(x, sy + 12, 6, 0, CHAT[0]).replace('<circle', '<circle opacity=".7"') + text(x, sy - 30, '+5', 20, `fill:${CHAT[0]}`) +
      spark(x - 24, sy - 8, 5, 'var(--text)') + spark(x + 22, sy - 14, 4, CHAT[0]) + spark(x + 8, sy - 50, 3.5, 'var(--text)') + spark(x - 14, sy - 44, 3, CHAT[0]); } }),
    'landing', 'The slot dips and springs back (200 ms) and flashes the ball’s colour; the ball sinks in; <b style="display:inline;color:inherit">+5</b> floats up and fades (900 ms). Bigger values: a bigger number and more sparkles.')}
  ${fig(300, 250, mini({ slot: (i) => i === 4 ? { dy: -2 } : null,
    extra: ({ x0, sw, sy }) => { const x = x0 + 4 * sw; return ball(x - 11, sy - 4, 10, 0, CHAT[3]) + `<path d="M${x + 4} ${sy - 8} q6 -6 12 0 M${x + 2} ${sy - 16} q8 -8 18 0" fill="none" stroke-width="2" style="stroke:var(--gold)" opacity=".7"/>` +
      text(x - 6, sy - 44, 'so close!', 15, 'fill:var(--gold);font-style:italic'); } }),
    'near miss', 'A ball that touches the jackpot slot’s edge and falls the other way: the jackpot slot wobbles and a small “so close!” pops up. Cheap, and chat loves it.')}
</div>`;

const K = .45, JW = 640 * K, JH = 540 * K;
const jb = (inner) => scaled(K, frame('chaplinko', 640, 540, inner));
const jSlot = { x: 527, y: 430, w: 46, h: 44, cx: 550 };
const jDim = (a) => `<div class="dim" style="background:rgb(0 0 0 / ${a})"></div>`;
const jLit = (extra = '') => svg(640, 540, [`<rect x="${jSlot.x + 1.5}" y="${jSlot.y}" width="43" height="44" rx="6" style="fill:var(--gold)"/><rect x="${jSlot.x - 6}" y="${jSlot.y - 6}" width="58" height="56" rx="10" style="fill:var(--gold)" filter="url(#glow)" opacity=".7"/>` + text(jSlot.cx, jSlot.y + 23, 100, 15, 'fill:var(--accent-ink)') + extra]);
const card = (style, k, who = 'pixelpriya', pts = '+100', sub = '1 in 512 · the first today') => `<div class="card" style="${style}"><div class="k">${k}</div><div class="who"><span class="dot tw"></span>${who}</div><div class="pts">${pts}</div><div class="sub">${sub}</div></div>`;
const sbJackpot = () => `<div class="sb">
  ${fig(JW, JH, jb(classic({ balls: false }) + jDim(.5) + jLit(ball(jSlot.cx, jSlot.y + 6, 10, 0, CHAT[0]) + `<path d="M540 380 v30 M550 372 v34 M560 380 v30" stroke-width="2" style="stroke:var(--text)" opacity=".5"/>`) ),
    '0 ms · slow motion', 'A ball drops into the jackpot. Every ball slows to a third for 0.4 s and the board dims around the lit slot.')}
  ${fig(JW, JH, jb(classic({ balls: false }) + jDim(.35) + jLit(`<defs><linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d8b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/></linearGradient></defs>
      <rect x="${jSlot.x + 4}" y="0" width="38" height="${jSlot.y}" fill="url(#beam)"/>` + ring(jSlot.cx, jSlot.y, 120, 'var(--gold)', .55, 3) + ring(jSlot.cx, jSlot.y, 200, 'var(--gold)', .25, 2) +
      [[504, 392], [458, 392], [527, 354], [481, 354], [504, 316], [573, 392], [550, 354]].map(([x, y]) => pegc(x, y, 'var(--gold)', .9)).join(''))),
    '200 ms · the beam', 'A beam of jackpot pink shoots up from the slot and a ripple runs out through the pegs; each peg flashes as the wave passes (500 ms).')}
  ${fig(JW, JH, jb(classic({ balls: false }) + jDim(.45) + card('transform:translate(-50%,-50%) rotate(-7deg) scale(1.1)', 'JACK<span style="opacity:.25">POT!</span>', 'pixelpriya', '+37', '&nbsp;')),
    '450 ms · the card', 'The card springs in (overshoots, settles tilted), JACKPOT! pops in a letter at a time, the name slides up and the points count up from 0.')}
  ${fig(JW, JH, jb(classic({ balls: false }) + jDim(.45) + scaled(640 / 960, confetti()) + card('', 'JACKPOT!')),
    '700 ms · confetti', 'Confetti bursts from both bottom corners (80 pieces, 2.2 s) and the board gives one small shake. Balls keep falling behind.')}
  ${fig(JW, JH, jb(classic() + card('left:88%;top:12%;transform:translate(-50%,-50%) scale(.3) rotate(4deg);opacity:.85', 'JACKPOT!') + svg(640, 540, [`<path d="M420 160 Q500 90 540 70" fill="none" stroke-width="10" stroke-linecap="round" style="stroke:var(--gold)" opacity=".25"/>`])),
    '4 s · away', 'The card shrinks off toward the leaderboard (combined: into the winner’s row), the board brightens and time runs normally. Several jackpots queue.')}
</div>`;

const LK = .9, LW = 300 * LK, LH = 270 * LK;
const lbRow = (i, [u, pl, sc], st = '', after = '', pts = sc.toLocaleString()) => `<div class="row fx" style="${st}"><b>${i}</b><span class="dot ${pl}"></span><span class="n">${u}</span>${after}<span class="p">${pts}</span></div>`;
const lbBox = (inner, tabs = '<div class="tabs"><span class="on">This stream</span><span>All time</span></div>', extra = '') =>
  scaled(LK, frame('chaplinko', 300, 270, `<div class="lb src"><h2>Leaderboard</h2>${tabs}${inner}</div>${extra}`));
const L = PLAYERS;
const sbBoard = () => `<div class="sb">
  ${fig(LW, LH, lbBox(lbRow(1, L[0]) + lbRow(2, L[1]) + lbRow(3, L[2], 'background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%)', '<span class="chip">+25</span>', '87<span style="opacity:.45">2</span>') + lbRow(4, L[3]) + lbRow(5, L[4])),
    'a score goes up', 'The points count up (600 ms, fixed-width digits so nothing jiggles), a sweep of the accent crosses the row, and a <b style="display:inline;color:inherit">+25</b> chip fades out beside it.')}
  ${fig(LW, LH, lbBox(lbRow(1, L[0]) + lbRow(2, L[1], 'transform:translateY(16px);opacity:.7') + lbRow('<span style="display:inline-block;transform:translateY(-4px);opacity:.6">2</span>', [L[2][0], L[2][1], 1130], 'transform:translateY(-16px) scale(1.04);background:var(--slot);border-radius:10px;box-shadow:0 8px 20px #0007;z-index:2') + lbRow(4, L[3]) + lbRow(5, L[4])),
    'overtaking', 'Rows slide past each other (400 ms, a little overshoot). The one going up lifts above the rest; the rank numbers roll like a counter.')}
  ${fig(LW, LH, lbBox(lbRow(1, [L[2][0], L[2][1], 1302], 'background:linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--text) 18%, transparent) 40%, transparent 60%)', `<svg width="30" height="30" style="position:absolute;left:96px;top:2px;overflow:visible">${ball(12, 12, 8)}<path d="M4 -2 v-8 M12 -4 v-10 M20 -2 v-8" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/></svg>`) + lbRow(2, L[0]) + lbRow(3, L[1]) + lbRow(4, L[3]) + lbRow(5, L[4])),
    'a new #1', 'A tangerine ball drops onto the new leader’s name and bounces twice; a shine sweeps across the row.')}
  ${fig(LW, LH, lbBox(lbRow(1, ALLTIME[0]) + lbRow(2, ALLTIME[1], 'opacity:.65;transform:translateY(6px)') + lbRow(3, ALLTIME[2], 'opacity:.3;transform:translateY(16px)'),
      `<div class="tabs" style="position:relative"><i style="position:absolute;left:30%;width:50%;top:0;bottom:0;border-radius:999px;background:var(--accent)"></i><span style="background:none;position:relative">This stream</span><span style="background:none;position:relative;color:var(--accent-ink)">All time</span>
       <i style="position:absolute;left:0;right:0;bottom:-7px;height:3px;border-radius:3px;background:var(--slot)"></i><i style="position:absolute;left:0;bottom:-7px;height:3px;width:8%;border-radius:3px;background:var(--accent)"></i></div>`),
    'switching lists', 'With “both”: the tab pill slides across, the old rows lift away and the new ones deal in from below (600 ms). A thin bar under the tabs fills until the next switch, and waits while a score is moving.')}
  ${fig(LW, LH, lbBox(lbRow(1, L[0]) + lbRow(2, L[1], 'box-shadow:inset 0 0 0 2px var(--gold), 0 0 18px color-mix(in srgb, var(--gold) 55%, transparent);border-radius:10px;border-color:transparent', '<span class="chip" style="background:var(--gold);color:#fff">JACKPOT</span>') + lbRow(3, L[2]) + lbRow(4, L[3]) + lbRow(5, L[4])),
    'jackpot on the board', 'The winner’s row glows jackpot pink for 3 s, in the separate source too (the board announces it on the channel it already uses).')}
</div>`;

const sbExtras = () => `<div class="sb">
  ${fig(300, 250, mini({ peg: (q) => q.r === 2 ? `<g opacity=".45" transform="translate(${q.x} ${q.y}) scale(.5) translate(${-q.x} ${-q.y})">${peg(q.x, q.y)}</g>` : q.r === 3 ? '' : undefined, slot: () => ({ dy: 22, a: .3 }) }),
    'the board appears', 'When the source loads or the scene changes: pegs pop in row by row (30 ms apart) and the slots rise into place. 0.8 s.')}
  ${fig(300, 250, mini({ chute: chute(150, CMDS, `<defs><linearGradient id="shim" x1="0" x2="1"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="18" y="0" width="264" height="30" rx="8" fill="url(#shim)"/>`) }),
    'idle', 'No drops for a minute: a shine runs along the commands every 30 s, inviting a <code>!drop</code>. Nothing else runs while the board is idle.')}
  ${fig(300, 250, mini({ chute: chute(150, `<tspan style="fill:var(--accent)">+37</tspan> waiting to drop`), extra: () => ball(120, 45, 10, 0, CHAT[1]) + ball(150, 80, 10, 0, CHAT[2]) + ball(185, 110, 10, 0, CHAT[0]) + ball(100, 150, 10, 0, CHAT[3]) + ball(200, 160, 10, 0, CHAT[5]) + ball(160, 180, 10, 0, CHAT[4]) }),
    'busy (a raid)', 'Past the most balls on screen, the chute shows how many are waiting and counts down as they drop in.')}
  ${fig(300, 250, mini({ chute: chute(150, `<tspan style="fill:var(--muted)">❚❚</tspan> PAUSED`) , extra: () => ball(190, 150, 10, 0, CHAT[2]) }),
    'paused', '<code>!drop pause</code>: the chute says PAUSED and balls already falling land. <code>!drop resume</code>: it flashes GO! for a moment.')}
  ${fig(300, 250, mini({ extra: () => [[110, 70, 0], [180, 100, 1], [140, 140, 3], [205, 170, 5]].map(([x, y, c], k) => k === 0 ? ball(x, y, 10, 0, CHAT[c]) :
      ring(x, y, 8 + k * 3, CHAT[c], .9 - k * .2, 3) + [0, 1, 2, 3, 4, 5].map((j) => `<circle cx="${x + Math.cos(j) * (10 + k * 4)}" cy="${y + Math.sin(j) * (10 + k * 4)}" r="2" style="fill:${CHAT[c]}" opacity="${.9 - k * .2}"/>`).join('')).join('') }),
    'cleared', '<code>!drop clear</code>: every ball pops into a little puff, 20 ms apart, and scores nothing.')}
</div>`;

const V = {
  classic: ['Board source: Plinko · 640×540 · chaplinko theme (the default), with a background', () => frame('chaplinko', 640, 540, classic() + credit)],
  pachinko: ['Board source: Pachinko · 640×540 · neon theme', () => frame('neon', 640, 540, pachinko() + credit)],
  tower: ['Board source: Pin tower · tall 360×640 · candy theme', () => frame('candy', 360, 640, tower())],
  jackpot: ['Board source: the top prize card · chaplinko theme', () => frame('chaplinko', 640, 540, classic({ balls: false }) + `<div class="dim"></div>` + confetti() +
    `<div class="card"><div class="k">JACKPOT!</div><div class="who"><span class="dot tw"></span>pixelpriya</div><div class="pts">+100</div><div class="sub">1 in 512 · the first today</div></div>`)],
  panel: ['Leaderboard source: panel · 300×270 · chaplinko theme, with a background', () => frame('chaplinko', 300, 270, panel())],
  strip: ['Leaderboard source: strip · 720×72 · neon theme', () => frame('neon', 720, 72, strip())],
  clear: ['Board source, transparent: no background, no frame, pegs and slots shadowed to read over any game (the default) · chaplinko theme', () => `<div class="scene" style="width:640px;height:540px">${frame('chaplinko', 640, 540, classic(), '', true)}</div>`],
  lbclear: ['Leaderboard source, transparent: panel and strip straight over the game · chaplinko and neon themes', () => `<div class="scene" style="width:960px;height:540px">
    <div style="position:absolute;left:0;top:0">${frame('chaplinko', 300, 270, panel(), '', true)}</div>
    <div style="position:absolute;left:0;bottom:0">${frame('neon', 720, 72, strip(), '', true)}</div></div>`],
  scene: ['Separate: two sources over the game, transparent (the default) (1280×720)', () => `<div class="scene">
    <div class="src-at" style="left:28px;top:28px;width:180px;height:162px"><div style="transform:scale(.6);transform-origin:0 0">${frame('chaplinko', 300, 270, panel(), '', true)}</div><span class="tag">leaderboard source</span></div>
    <div class="src-at" style="right:28px;bottom:28px;width:384px;height:324px"><div style="transform:scale(.6);transform-origin:0 0">${frame('chaplinko', 640, 540, classic(), '', true)}</div><span class="tag">board source</span></div></div>`],
  combined: ['Combined: one source, the board with the leaderboard beside it · 960×540 · transparent (the default) · chaplinko theme', () => `<div class="scene" style="width:960px;height:540px">${frame('chaplinko', 960, 540,
    `<div style="position:absolute;left:0;top:0">${classic()}</div><div style="position:absolute;right:0;top:0;width:300px;height:270px">${panel()}</div>`, '', true)}</div>`],
  'sb-drop': ['Motion: a ball, from the chute to its slot', sbDrop],
  'sb-jackpot': ['Motion: the jackpot, second by second', sbJackpot],
  'sb-leaderboard': ['Motion: the leaderboard', sbBoard],
  'sb-board': ['Motion: the board’s moments', sbExtras],
  hero: ['The board alone, transparent, for the website mockup', () => frame('chaplinko', 640, 540, classic(), '', true)],
  accents: ['The same board with a background: chaplinko (the default), chatagram and the other themes, some with other accents (640×540 each, shown at half size)', () => `<div class="mini">${[['chaplinko', ''], ['chatagram', ''], ['neutral', ''], ['light', ''], ['cozy', ''], ['neon', '#ff4155'], ['royal', '#ffd98a'], ['deep', '#45d6c8'], ['candy', '#ff7bd5']]
    .map(([t, a]) => `<div style="width:320px;height:270px;overflow:hidden"><div style="transform:scale(.5);transform-origin:0 0">${frame(t, 640, 540, classic({ w: 640 }), a)}</div></div>`).join('')}</div>`],
};
const q = new URLSearchParams(location.search).get('v');
if (q) document.body.classList.add('solo');
if (q === 'hero') document.documentElement.classList.add('bare');
document.getElementById('page').innerHTML = Object.entries(V).filter(([k]) => !q || k === q)
  .map(([, [cap, f]]) => `<div><p class="cap">${cap}</p>${f()}</div>`).join('');
</script>
</body>
</html>
