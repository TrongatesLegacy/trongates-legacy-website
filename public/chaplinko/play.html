<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chaplinko board</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Chaplinko's OBS browser source: the board, 640 × 540 (layout=separate: the leaderboard is its own source,
     leaderboard.html) or 960 × 540 (layout=combined: the leaderboard beside it). Set it up at /chaplinko/, which writes
     this page's link. docs/widgets.md explains how it all works. -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../widgets/lib/themes.css">
<link rel="stylesheet" href="play.css">
</head>
<body>
<div class="stage">
  <div class="w" id="w" data-theme="chaplinko">
    <div class="board" id="board">
      <canvas id="cv" width="640" height="540"></canvas>
      <div class="glow"></div>
      <div class="chute" id="chute"></div>
      <div class="prompt" id="prompt" aria-hidden="true"></div>
      <div class="credit">Made by TrongatesLegacy.com</div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>
<script src="../widgets/lib/settings.js"></script>
<script src="../widgets/lib/theme.js"></script>
<script src="../widgets/lib/platforms/twitch.js"></script>
<script src="../widgets/lib/platforms/kick.js"></script>
<script src="../widgets/lib/chat.js"></script>
<script src="../widgets/lib/scores.js"></script>
<script src="settings.js"></script>
<script src="physics.js"></script>
<script src="odds.js"></script>
<script src="game.js"></script>
<script src="leaderboard.js"></script>
<script src="demo.js"></script>
<script src="play.js"></script>
</body></html>
