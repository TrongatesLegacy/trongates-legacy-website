<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat box · Trongates Legacy OBS</title>
<meta name="robots" content="noindex">
<!-- OBS browser source (Local file, or https://www.trongateslegacy.com/obs/chat), 500x800 suggested (any size works), 30 FPS. See obs/README.md.
     Paths are relative so the folder works both hosted and as local files. -->
<link rel="stylesheet" href="shared/overlay.css">
<script src="shared/theme.js"></script>
<style>
html, body { width: 100%; height: 100%; }
.frame, .np { inset: 0; }
.bare .frame { background: none; backdrop-filter: none; clip-path: none; }
.bare .frame::before, .bare .frame::after, .bare .frame .tab { display: none; }
.bare [data-slot] { left: 0 !important; right: 0 !important; top: 0 !important; bottom: 0 !important; }</style>
</head>
<body class="transparent">
<script src="shared/icons.js"></script>
<div class="frame">
  <div class="tab"><svg class="i"><use href="#i-kick"/></svg>Chat</div>
  <div data-slot="Botrix chat" style="position:absolute;left:18px;right:18px;top:52px;bottom:18px"></div>
</div>
<script>if (new URLSearchParams(location.search).get('bare') === '1') document.documentElement.classList.add('bare');</script>
<script src="shared/scene.js"></script>
</body></html>
