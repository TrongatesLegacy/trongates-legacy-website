<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Trongates control</title>
<meta name="robots" content="noindex">
<!-- OBS custom browser dock (Docks → Custom Browser Docks): https://www.trongateslegacy.com/obs/control.html?obs=4455
     Shows whether the overlays can see veadotube, which state maps to which form, and has manual form buttons
     that recolour every scene through the OBS WebSocket server. The panel itself is shared/control.js, which
     the index page embeds too. See obs/README.md. -->
<script>window.TGL_NO_AUTOCONNECT = true;</script>
<script src="shared/theme.js"></script>
<script src="shared/control.js"></script>
<style>
@font-face { font-family: Orbitron; font-weight: 400 900; src: url(assets/fonts/orbitron.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(assets/fonts/chakra-petch-600.woff2) format("woff2"); }
:root { --accent: #22e5ff; }
* { box-sizing: border-box; margin: 0; }
body { padding: 14px; background: #070d18; }
</style></head>
<body>
<div id="panel"></div>
<script>TGLControl.mount(document.getElementById('panel'));</script>
</body></html>
