<!doctype html><html><head><meta charset="utf-8"><title>Kick banner</title><style>
@font-face { font-family: Orbitron; font-weight: 400 900; src: url(../../../public/assets/fonts/orbitron.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(../../../public/assets/fonts/chakra-petch-600.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { background: #03060d; }
/* 1440x160 = 9:1, the shape of Kick's banner cropper. Kick serves it as a 1105x123 JPG, centre-cropped
   (object-fit: cover) into a strip that is always 134px tall but as wide as the page, so:
     - the wider the screen, the more is cut off the TOP and BOTTOM: ~7px of 160 at 1920 wide, ~30px at
       2560. All text therefore stays between y=30 and y=130, and characters start at y>=26.
     - laptops instead lose the left/right edges, and the "OFFLINE / stream title" box hides the left ~56%.
   Zones (% of width):
     34-66  chat user card (shows the middle third at full height; the avatar covers the bottom-centre)
            -> Lulu Gang logo + Discord line, Princess and Blobfish either side, docking ring for the avatar
     67-82  channel page title: starts right of the chat card's crop (which ends at 66.7%) and ends
            before the laptop crop (82%)
     83-100 bonus Tron on wide screens */
#banner { position: relative; width: 1440px; height: 160px; overflow: hidden; background: #03060d; color: #e8f4ff; font-family: "Chakra Petch", sans-serif; --c: #22e5ff; }
.grid { position: absolute; inset: 0; background:
  linear-gradient(#0e2034 1px, transparent 1px) 0 0 / 40px 40px,
  linear-gradient(90deg, #0e2034 1px, transparent 1px) 0 0 / 40px 40px; }
.glow { position: absolute; inset: 0; background: radial-gradient(40% 170% at 62% 50%, rgba(34,229,255,.16), transparent 70%); }
canvas { position: absolute; inset: 0; }
.art { position: absolute; top: 6px; height: 290px; filter: drop-shadow(0 0 18px rgba(34,229,255,.35)); }
.a1 { right: 26px; height: 250px; top: 26px; } .a2 { left: 498px; height: 236px; top: 26px; filter: drop-shadow(0 0 18px rgba(255,99,184,.35)); } .a3 { left: 795px; height: 205px; top: 24px; transform: scaleX(-1); filter: drop-shadow(0 0 16px rgba(255,179,107,.3)); }
.center { position: absolute; top: 0; bottom: 0; left: 968px; width: 214px; display: grid; place-content: center; justify-items: start; gap: 8px; text-align: left; }
.eyebrow, .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase; color: var(--c); display: flex; align-items: center; gap: 14px; }
.eyebrow::before, .eyebrow::after { content: ""; width: 30px; height: 1px; background: var(--c); }
.tag { color: #cfe3f5; letter-spacing: .13em; font-size: 11.5px; white-space: nowrap; }
.tag b { color: #53fc18; font-weight: 600; }
h1 { position: relative; font: 900 27.5px/1.1 Orbitron; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
h1 span { display: block; }
h1 .o { color: var(--c); text-shadow: 0 0 14px rgba(34,229,255,.55); }
h1 .s { background: linear-gradient(180deg, #fff 30%, var(--c) 125%); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 .ghost { position: absolute; inset: 0; opacity: 0; display: none; }
h1 .ghost.r { color: #ff2d78; } h1 .ghost.b { color: #22e5ff; }
.sheen { position: absolute; inset: -6px -20px; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(105deg, transparent 0 46%, rgba(255,255,255,.55) 50%, transparent 54% 100%) no-repeat; background-size: 300% 100%; opacity: 0; }
.mid { position: absolute; left: 50%; top: 23px; width: 200px; margin-left: -100px; display: grid; justify-items: center; gap: 2px; }
.mid .eyebrow { font-size: 10.5px; letter-spacing: .28em; gap: 8px; white-space: nowrap; }
.mid .eyebrow::before, .mid .eyebrow::after { width: 16px; }
.mid .logos { position: relative; width: 150px; height: 61px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
.mid .logos img { position: absolute; } .mid .lulu { left: 4px; top: -4px; width: 88px; transform: rotate(-6deg); } .mid .gng { right: 2px; bottom: 0; width: 84px; transform: rotate(-3deg); }
/* Below the logo: a docking ring rising from the bottom edge. In the chat user card the avatar sits exactly
   here (centre x=50%, ~100px wide, centred just below the bottom edge), so the ring frames it; on the full
   banner it fills the space under the logo as an identity-disc motif with the Discord call to action. */
.join { display: flex; align-items: center; gap: 6px; margin-top: 1px; font: 900 10.5px/1 Orbitron; letter-spacing: .16em; text-transform: uppercase; color: #ffe3f3; white-space: nowrap; text-shadow: 0 0 8px rgba(255,99,184,.7); }
.join svg { width: 14px; height: 14px; fill: #9aa6ff; }
.dock { position: absolute; left: 50%; top: 162px; width: 0; height: 0; }
.dock svg { position: absolute; left: -70px; top: -70px; width: 140px; height: 140px; overflow: visible; }
.dock circle { fill: none; stroke: #ff63b8; }
.dock .glow2 { position: absolute; left: -64px; top: -64px; width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(circle, rgba(255,99,184,.4), rgba(255,99,184,.12) 55%, transparent 72%); }
</style></head><body>
<div id="banner">
  <div class="grid"></div><div class="glow"></div>
  <canvas id="cv" width="1440" height="160"></canvas>
  <img class="art a1" src="../../../public/assets/img/tron-cyan-mclosed-eopen.webp">
  <img class="art a2" src="../../../public/assets/img/princess-peace.webp">
  <img class="art a3" src="../../../public/assets/img/blobfish-mclosed-eopen.webp">
  <div class="mid">
    <span class="logos"><img class="lulu" src="../../../public/assets/img/lulu.webp"><img class="gng" src="../../../public/assets/img/gang.webp"></span>
    <div class="join"><svg viewBox="0 0 24 24"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>Join the Discord</div>
  </div>
  <div class="dock"><i class="glow2"></i><svg viewBox="-70 -70 140 140">
    <circle r="53" stroke-width="3" stroke-dasharray="46 14 6 14" style="filter: drop-shadow(0 0 4px #ff63b8)"/>
    <circle r="57" stroke-width="1.4" stroke-dasharray="3 6" opacity=".9"/>
  </svg></div>
  <div class="center">
    <h1><span class="o">Trongates</span><span class="s">Legacy</span>
      <span class="ghost r" id="gr">Trongates Legacy</span><span class="ghost b" id="gb">Trongates Legacy</span>
      <span class="sheen" id="sheen"></span></h1>
    <div class="tag">CEO of the Lulu Gang</div>
  </div>
</div>
<script>
// Deterministic animation: setT(t) draws the frame for loop position t in [0,1), so the loop is seamless.
const ctx = document.getElementById('cv').getContext('2d');
const W = 1440, H = 160, CELL = 40;
// light cycles: each rides a grid row, crossing the banner a whole number of times per loop
const riders = [
  { y: 1, dir: 1, laps: 1, off: .05, c: '#22e5ff', len: 360 },
  { y: 3, dir: -1, laps: 1, off: .45, c: '#ff8a3d', len: 300 },
  { y: 3, dir: 1, laps: 2, off: .8, c: '#22e5ff', len: 240 },
  { y: 1, dir: -1, laps: 2, off: .3, c: '#22e5ff', len: 260 },
];
function setT(t) {
  ctx.clearRect(0, 0, W, H);
  for (const r of riders) {
    const span = W + r.len * 2;
    const p = ((t * r.laps + r.off) % 1) * span - r.len;
    const head = r.dir > 0 ? p : W - p, tail = head - r.dir * r.len, y = r.y * CELL + .5;
    const g = ctx.createLinearGradient(tail, 0, head, 0);
    g.addColorStop(0, r.c + '00'); g.addColorStop(1, r.c);
    ctx.strokeStyle = g; ctx.lineCap = 'round';
    ctx.globalAlpha = .25; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(tail, y); ctx.lineTo(head, y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tail, y); ctx.lineTo(head, y); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(head, y, 2.6, 0, 6.3); ctx.fill();
  }
  // like the website, trails fade out where they pass behind the text so they never cut through it
  const a = document.querySelector('.a2').getBoundingClientRect(), z = document.querySelector('.center').getBoundingClientRect();
  const box = { left: a.left, width: z.right - a.left };
  ctx.globalCompositeOperation = 'destination-out';
  for (const [pad, alpha] of [[70, .4], [40, .5], [14, .7]]) {
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.roundRect(box.left - pad, -10, box.width + pad * 2, H + 20, 40); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // sheen sweeps the title once per loop
  const sh = document.getElementById('sheen'), s = (t - .08) / .3;
  sh.style.opacity = s > 0 && s < 1 ? Math.sin(Math.PI * s) : 0;   // eases in and out, so it never ends as a hard block
  sh.style.backgroundPosition = `${100 - s * 100}% 0`;
  // two short glitch bursts, same pattern as the website title
  const gr = document.getElementById('gr'), gb = document.getElementById('gb');
  const bursts = [[.62, -6, 2, 'inset(10% 0 55% 0)', 5, -1, 'inset(40% 0 30% 0)'], [.66, 5, -2, 'inset(60% 0 8% 0)', -5, 1, 'inset(5% 0 72% 0)']];
  gr.style.opacity = gb.style.opacity = 0;
  for (const [at, rx, ry, rc, bx, by, bc] of bursts) if (t >= at && t < at + .035) {
    gr.style.opacity = gb.style.opacity = .85;
    gr.style.transform = `translate(${rx}px,${ry}px)`; gr.style.clipPath = rc;
    gb.style.transform = `translate(${bx}px,${by}px)`; gb.style.clipPath = bc;
  }
}
setT(0);
</script></body></html>
