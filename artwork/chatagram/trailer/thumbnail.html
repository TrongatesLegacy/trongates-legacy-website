<!doctype html>
<!-- YouTube thumbnails for the trailer, rendered by thumbnail.mjs at 2×: 3840 × 2160 (video, 16:9) and, with ?v=1,
     2160 × 3840 (Shorts, 9:16), YouTube's recommended sizes. Big, few words, readable at phone-thumbnail size. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Lilita One"; src: url(/assets/fonts/lilita-one.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; src: url(/assets/fonts/chakra-petch-600.woff2) format("woff2"); font-weight: 600; }
:root { --ink: #16122b; --ink2: #221b40; --coral: #ff5a5f; --sun: #ffc93c; --paper: #fff7ec; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--paper); font-family: "Lilita One", sans-serif; }
body { position: relative; background: radial-gradient(circle at 12% 18%, #ff5a5f55, transparent 42%), radial-gradient(circle at 88% 85%, #ffc93c40, transparent 45%), var(--ink); }
body::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(#ffffff1a 3px, transparent 3px); background-size: 56px 56px; }
.logo { position: absolute; left: 90px; top: 70px; display: flex; align-items: center; gap: 20px; font-size: 84px; line-height: 1; }
.logo img { width: 104px; height: 104px; } .logo b { color: var(--sun); font-weight: 400; }
h1 { position: absolute; left: 90px; top: 230px; margin: 0; font-size: 150px; line-height: .98; font-weight: 400; text-shadow: 0 8px 0 #0006; }
h1 em { font-style: normal; color: var(--sun); display: block; }
.tiles { position: absolute; left: 90px; top: 590px; display: flex; gap: 22px; }
.tile { width: 128px; height: 136px; border-radius: 22px; background: linear-gradient(180deg, #fffdf7, #efe3cf); color: var(--ink); display: grid; place-items: center;
  font-size: 96px; box-shadow: 0 10px 0 var(--coral), 0 18px 34px #0008; }
.tile.hot { background: var(--sun); box-shadow: 0 10px 0 #c9921a, 0 0 40px #ffc93caa; }
.tile:nth-child(odd) { transform: translateY(-10px) rotate(-3deg); } .tile:nth-child(even) { transform: translateY(8px) rotate(3deg); }
.chips { position: absolute; left: 90px; top: 830px; display: flex; gap: 22px; }
.chip { display: inline-flex; align-items: center; gap: 16px; font-size: 64px; padding: 16px 34px; border-radius: 26px; box-shadow: 0 8px 0 #0005; }
.chip svg { width: 62px; height: 62px; }
.chip.t { background: #9146ff; } .chip.k { background: #53fc18; color: #0b0b0b; } .chip.f { background: var(--coral); color: var(--ink); }
.board { position: absolute; right: 70px; top: 230px; width: 860px; transform: rotate(4deg); filter: drop-shadow(0 30px 50px #000c); }
.board img { width: 100%; display: block; }
.burst { position: absolute; right: 110px; top: 790px; transform: rotate(-5deg); background: var(--sun); color: var(--ink); font-size: 70px; padding: 14px 34px 18px; border-radius: 24px; box-shadow: 0 10px 0 #c9921a, 0 20px 40px #0008; }
/* ---- Shorts: 1080 × 1920 ---- */
html.v, .v body { width: 1080px; height: 1920px; }
.v .logo { left: 0; right: 0; justify-content: center; top: 130px; font-size: 96px; } .v .logo img { width: 120px; height: 120px; }
.v h1 { left: 0; right: 0; text-align: center; top: 330px; font-size: 160px; }
.v .tiles { left: 0; right: 0; justify-content: center; top: 760px; gap: 18px; }
.v .tile { width: 140px; height: 150px; font-size: 104px; }
.v .board { right: auto; left: 50px; top: 1020px; width: 980px; transform: rotate(-3deg); }
.v .burst { right: 70px; top: 1500px; font-size: 76px; transform: rotate(-4deg); }
.v .chips { left: 0; right: 0; justify-content: center; top: 1700px; }
.v .chip { font-size: 60px; padding: 14px 28px; }
</style>
<script>if (/[?&]v=1/.test(location.search)) document.documentElement.classList.add('v');</script>
</head><body>
<svg width="0" height="0" style="position:absolute"><defs>

  <symbol id="i-twitch" viewBox="0 0 10 10"><path d="M2 1 1.2 2.8v5.4h2V9.3h1.1l1.1-1.1h1.7L9 6.3V1zm6.2 4.9-1.3 1.3H5.1L4 8.3V7.2H2.4V1.8h5.8zM6.9 3v2.2h-.8V3zm-2 0v2.2h-.8V3z" fill="currentColor"/></symbol>
</defs></svg>
<div class="logo"><img src="/chatagram/assets/icon.svg" alt=""><span>chat<b>agram</b></span></div>
<h1>Can your chat <em>solve it?</em></h1>
<div class="tiles"><span class="tile">N</span><span class="tile hot">R</span><span class="tile">G</span><span class="tile">D</span><span class="tile hot">A</span><span class="tile">E</span></div>

</body></html>
