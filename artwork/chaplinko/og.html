<!doctype html>
<!-- Chaplinko's link-preview image (1200 × 630): rendered by render.mjs, served next to public/ so the board inside is real
     (its seeded still, transparent over the brand's midnight). docs/widgets.md, "The Chaplinko page". -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Bungee; src: url(/assets/fonts/bungee.woff2) format("woff2"); }
@font-face { font-family: "Space Grotesk"; src: url(/assets/fonts/space-grotesk.woff2) format("woff2"); font-weight: 300 700; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #0a1233; color: #eef3ff; font-family: "Space Grotesk", sans-serif; position: relative;
  background-image: radial-gradient(circle at 78% 30%, #2f5bff55, transparent 45%), radial-gradient(circle, #eef3ff1c 1.6px, transparent 2px); background-size: auto, 28px 24px; }
.lock { position: absolute; left: 64px; top: 60px; display: flex; align-items: center; gap: 18px; }
.lock img { width: 84px; height: 84px; }
.word { font: 400 60px/1 Bungee; display: inline-flex; align-items: baseline; }
.word .o { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-left: .04em; background: radial-gradient(circle at 35% 30%, #fff9 0 12%, transparent 36%), #ff7a1a; box-shadow: 0 .07em 0 -.025em #ff3d8b; }
.by { position: absolute; left: 168px; top: 150px; font-size: 22px; color: #9fb0e0; }
h1 { position: absolute; left: 64px; top: 220px; margin: 0; font: 400 76px/.95 Bungee; }
h1 em { font-style: normal; color: #ff7a1a; text-shadow: 0 0 30px #ff7a1a66; }
p { position: absolute; left: 64px; top: 410px; width: 470px; margin: 0; font-size: 24px; line-height: 1.4; color: #9fb0e0; }
p b { color: #eef3ff; background: #1b2a66; padding: 0 8px; border-radius: 8px; }
.chips { position: absolute; left: 64px; bottom: 56px; display: flex; gap: 12px; }
.chips span { display: inline-flex; gap: 8px; align-items: center; background: #ffffff12; box-shadow: inset 0 0 0 1px #ffffff26; border-radius: 99px; padding: 8px 16px; font-size: 21px; font-weight: 600; }
.chips i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.screen { position: absolute; right: 30px; top: 40px; width: 640px; height: 540px; }
.screen iframe { width: 640px; height: 540px; border: 0; background: transparent; }
.url { position: absolute; right: 56px; bottom: 34px; font-size: 21px; color: #9fb0e0; } .url b { color: #eef3ff; }
</style></head><body>
<div class="lock"><img src="/chaplinko/assets/icon.svg" alt=""><span class="word">CHAPLINK<span class="o"></span></span></div>
<div class="by">made by TrongatesLegacy</div>
<h1>LET CHAT<br><em>DROP.</em></h1>
<p>Chat types <b>!plinko</b>, balls bounce into the slots, everyone climbs the leaderboard.</p>
<div class="chips"><span><i style="background:#9146ff"></i>Twitch</span><span><i style="background:#53fc18"></i>Kick</span><span>Free</span></div>
<div class="screen"><iframe src="/chaplinko/play.html?still=1&credit=0"></iframe></div>
<div class="url"><b>trongateslegacy.com</b>/chaplinko</div>
</body></html>
