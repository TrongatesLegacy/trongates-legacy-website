<!doctype html><html><head><meta charset="utf-8"><title>Facebook cover</title><style>
/* 1640x924 = 16:9, which is what facebook.com/help/125379114252045 says a Page cover is on a computer
   (left aligned, full bleed). On phones the same cover is shown at 2.4:1, so the top and bottom are cropped:
     mobile keeps y 120-804 of 924  ->  all text and every character's head stays inside that band.
   The Page's profile picture (a circle, 176px on desktop) overlaps the bottom-left and covers ~40px of the
   cover on mobile, so the left ~22% is kept empty. Help page also: sRGB JPG loads fastest. */
@font-face { font-family: Orbitron; font-weight: 400 900; src: url(../../public/assets/img/../fonts/orbitron.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(../../public/assets/img/../fonts/chakra-petch-600.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { background: #03060d; }
#cover { position: relative; width: 1640px; height: 924px; overflow: hidden; background: #03060d; color: #e8f4ff; font-family: "Chakra Petch", sans-serif; --c: #22e5ff; }
.grid { position: absolute; inset: 0; background: linear-gradient(#0e2034 1px, transparent 1px) 0 0 / 56px 56px, linear-gradient(90deg, #0e2034 1px, transparent 1px) 0 0 / 56px 56px; }
.glow { position: absolute; inset: 0; background:
  radial-gradient(34% 55% at 72% 50%, rgba(34,229,255,.22), transparent 70%),
  radial-gradient(24% 40% at 60% 72%, rgba(255,99,184,.15), transparent 70%),
  radial-gradient(24% 40% at 88% 72%, rgba(255,179,107,.13), transparent 70%),
  radial-gradient(28% 45% at 12% 72%, rgba(34,229,255,.12), transparent 70%); }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; overflow: hidden; perspective: 700px; perspective-origin: 70% 0;
  -webkit-mask-image: linear-gradient(transparent 6%, #000 78%); }
.floor::before { content: ""; position: absolute; top: 0; left: -60%; right: -60%; height: 170%; transform-origin: 50% 0; transform: rotateX(66deg);
  background: linear-gradient(rgba(34,229,255,.4) 2px, transparent 2px) 0 0 / 76px 76px, linear-gradient(90deg, rgba(34,229,255,.4) 2px, transparent 2px) 0 0 / 76px 76px; }
/* the band phones keep (2.4:1); nothing important outside it */
.trail { position: absolute; height: 3px; border-radius: 3px; box-shadow: 0 0 12px currentColor; }
.trail::after { content: ""; position: absolute; right: -4px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.halo { position: absolute; left: 1205px; top: 440px; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; }
.halo i { position: absolute; inset: 0; border-radius: 50%; }
.halo .h1 { border: 2px dashed rgba(34,229,255,.42); }
.halo .h2 { inset: 22px; border: 3px solid transparent; border-top-color: #22e5ff; border-right-color: rgba(34,229,255,.55); transform: rotate(-32deg); filter: drop-shadow(0 0 6px #22e5ff); }
/* hero box + per-artwork transforms so the heads match (docs/design-system.md) */
.who { position: absolute; top: 288px; width: 240px; height: 360px; }
.who img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 80%; transform-origin: 50% 80%; }
.who.tron { left: 1128px; z-index: 3; filter: drop-shadow(0 14px 20px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(34,229,255,.4)); }
.who.trina { left: 975px; z-index: 2; filter: drop-shadow(0 12px 18px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,99,184,.35)); }
.who.trina img { transform: translate(.75%, -1.9%) scale(.937); }
.who.blob { left: 1283px; z-index: 2; filter: drop-shadow(0 12px 18px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,179,107,.3)); }
.who.blob img { transform: translate(-12.7%, -5.8%) scale(1.18); }
.pad { position: absolute; left: 1210px; top: 628px; width: 520px; height: 62px; margin-left: -260px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(34,229,255,.45), rgba(34,229,255,.1) 50%, transparent 72%); z-index: 1; }
.copy { position: absolute; left: 402px; top: 0; bottom: 0; width: 540px; display: grid; align-content: center; gap: 18px; z-index: 5; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.eyebrow::before { content: ""; width: 38px; height: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
h1 { font: 900 74px/1 Orbitron; letter-spacing: .02em; text-transform: uppercase; }
h1 span { display: block; }
h1 .o { color: transparent; -webkit-text-stroke: 2.2px var(--c); filter: drop-shadow(0 0 12px rgba(34,229,255,.5)); }
h1 .s { background: linear-gradient(180deg, #fff 30%, var(--c) 125%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 16px rgba(34,229,255,.45)); }
.tag { font-size: 24px; font-weight: 600; letter-spacing: .02em; color: #a9bfd6; white-space: nowrap; }
.links { display: flex; align-items: center; gap: 16px; font-size: 22px; font-weight: 600; white-space: nowrap; }
.links b { display: inline-flex; align-items: center; gap: 9px; color: #53fc18; }
.links svg { width: 23px; height: 23px; fill: #53fc18; filter: drop-shadow(0 0 6px rgba(83,252,24,.5)); }
.links i { font-style: normal; color: #3a4a63; }
.links span { color: #cfe3f5; }
</style></head><body>
<div id="cover">
  <div class="grid"></div><div class="glow"></div>
  <i class="trail" style="left:-20px;top:190px;width:380px;color:#22e5ff;background:linear-gradient(90deg,transparent,#22e5ff)"></i>
  <i class="trail" style="left:940px;top:150px;width:330px;color:#ff8a3d;background:linear-gradient(90deg,transparent,#ff8a3d)"></i>
  <div class="floor"></div>
  <div class="halo"><i class="h1"></i><i class="h2"></i></div>
  <i class="pad"></i>
  <div class="who trina"><img src="../../public/assets/img/princess-peace.webp"></div>
  <div class="who blob"><img src="../../public/assets/img/blobfish-mclosed-eopen.webp"></div>
  <div class="who tron"><img src="../../public/assets/img/tron-cyan-mclosed-eopen.webp"></div>
  <div class="copy">
    <div class="eyebrow">CEO of the Lulu Gang</div>
    <h1><span class="o">Trongates</span><span class="s">Legacy</span></h1>
    <p class="tag">Chill streams, gaming with friends.</p>
    <div class="links"><b><svg viewBox="0 0 24 24"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg>Live on Kick</b><i>/</i><span>trongateslegacy.com</span></div>
  </div>
</div></body></html>
